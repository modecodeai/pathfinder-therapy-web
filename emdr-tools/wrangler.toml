name = "pathfinder-emdr-tools"
main = "src/index.js"
compatibility_date = "2025-04-01"
workers_dev = true

[vars]
APP_NAME = "Pathfinder EMDR Tools"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "EmdrRoom"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountDirectory"

# Classes already provisioned in production — keep empty migrations list by
# referencing an already-applied tag name only if wrangler requires history.
# Deploy with --keep-vars; if migration error occurs we adjust.
