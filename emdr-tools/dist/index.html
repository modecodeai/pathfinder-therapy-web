  <body>
    <div id="root"></div>
    <script>
      // Keep active clinical phase chip in view on narrow screens.
      (function () {
        function scrollActivePhase() {
          var nav = document.querySelector(".phase-nav-v3, .phase-nav");
          if (!nav) return;
          var active = nav.querySelector("button.is-active, [aria-current='step'], [aria-pressed='true']");
          if (active && typeof active.scrollIntoView === "function") {
            active.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
          }
        }
        var obs = new MutationObserver(function () { scrollActivePhase(); });
        function arm() {
          var root = document.getElementById("root");
          if (!root) return;
          obs.observe(root, { subtree: true, childList: true, attributes: true, attributeFilter: ["class", "aria-current", "aria-pressed"] });
          scrollActivePhase();
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", arm);
        else arm();
        window.addEventListener("orientationchange", function () { setTimeout(scrollActivePhase, 250); });
        window.addEventListener("resize", function () { setTimeout(scrollActivePhase, 150); });
      })();
    </script>
  </body>
